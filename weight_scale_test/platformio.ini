; PlatformIO Project Configuration File
; Project: Weight Scale Test (5000g / 5kg Load Cell with HX711 on Classic ESP32)
; Target Board: Classic ESP32 DevKit (COM10)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

upload_port = COM10
upload_speed = 115200

monitor_port = COM10
monitor_speed = 115200
monitor_filters = time, direct

lib_deps =
    bogde/HX711 @ ^0.7.5
