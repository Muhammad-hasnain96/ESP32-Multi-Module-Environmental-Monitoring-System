; PlatformIO Project Configuration File for ESP32-S3 Module 3: Light & Soil Moisture
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM15
upload_speed = 921600
monitor_port = COM15
monitor_speed = 115200
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_ldf_mode = deep+
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    claws/BH1750 @ ^1.3.0
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
