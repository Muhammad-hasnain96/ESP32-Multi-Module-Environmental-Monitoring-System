; PlatformIO Project Configuration File
;
; Multi-Module Environmental Monitoring System
; Supports both classic ESP32 (DevKit-V1) and new ESP32-S3 (DevKitC-1)

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM13
upload_speed = 921600
monitor_port = COM13
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
lib_ldf_mode = deep+
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit CCS811 Library @ ^1.1.3
    adafruit/Adafruit BusIO @ ^1.16.1
    claws/BH1750 @ ^1.3.0
    bogde/HX711 @ ^0.7.5
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
upload_port = COM9
upload_speed = 115200
monitor_port = COM9
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit CCS811 Library @ ^1.1.3
    adafruit/Adafruit BusIO @ ^1.16.1
    claws/BH1750 @ ^1.3.0
    bogde/HX711 @ ^0.7.5
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
